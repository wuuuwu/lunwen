name: Build course app for macOS arm64

on:
  workflow_dispatch:
  push:
    branches:
      - codex/course-paper-reviewer
    paths:
      - "src/**"
      - "configs/**"
      - "migrations/**"
      - "scripts/build_course_macos.sh"
      - "course-paper-reviewer-macos.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-course-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy src
      - name: Run macOS packaging contract tests
        run: uv run pytest tests/unit/test_course_packaging.py
      - name: Run macOS report export tests
        shell: bash
        run: |
          set +e
          uv run pytest tests/unit/test_report_export.py --tb=short 2>&1 | tee pytest-macos-report.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            uv run python -c 'from pathlib import Path; text = Path("pytest-macos-report.log").read_text(encoding="utf-8")[-12000:]; escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print(f"::error title=macOS report export tests::{escaped}")'
            exit "$test_status"
          fi
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and self-test app bundle
        run: ./scripts/build_course_macos.sh
      - name: Upload ad-hoc-signed test build
        uses: actions/upload-artifact@v4
        with:
          name: CoursePaperReviewer-macos-arm64
          path: |
            dist-course-macos/CoursePaperReviewer-macos-arm64.zip
            dist-course-macos/CoursePaperReviewer-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
