[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paper-reviewer"
version = "0.1.0"
description = "A rubric-driven, evidence-grounded academic paper review harness."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Paper Reviewer Contributors" }]
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "ddgs>=9.15,<10",
  "httpx>=0.28",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "openai>=3.3.1,<4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "platformdirs>=4.3",
  "pymupdf>=1.25",
  "pyside6>=6.8,<7",
  "pyyaml>=6.0",
  "keyring>=25.6",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "tenacity>=9.0",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-qt>=4.4",
  "respx>=0.22",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "pyinstaller>=6.11",
]

[project.scripts]
paper-review = "paper_reviewer.cli:app"
paper-review-app = "paper_reviewer.gui.app:main"
paper-review-gallery = "paper_reviewer.gui.gallery:main"

[tool.hatch.build]
include = [
  "src/paper_reviewer/**/*.py",
  "src/paper_reviewer/**/*.txt",
  "src/paper_reviewer/**/*.json",
  "src/paper_reviewer/**/*.qss.in",
  "src/paper_reviewer/**/*.css",
  "src/paper_reviewer/**/*.svg",
  "src/paper_reviewer/**/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_reviewer"]

[tool.hatch.build.targets.wheel.force-include]
"configs/rubrics/unscored_draft.yaml" = "paper_reviewer/resources/configs/unscored_draft.yaml"
"configs/review_profiles/three_reviewer.yaml" = "paper_reviewer/resources/configs/three_reviewer.yaml"
"configs/rubrics/zhejiang_undergraduate_thesis_v2.yaml" = "paper_reviewer/resources/configs/zhejiang_undergraduate_thesis_v2.yaml"
"configs/review_profiles/zhejiang_undergraduate_specialists_v1.yaml" = "paper_reviewer/resources/configs/zhejiang_undergraduate_specialists_v1.yaml"
"configs/review_profiles/zhejiang_independent_panel_v1.yaml" = "paper_reviewer/resources/configs/zhejiang_independent_panel_v1.yaml"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "。", "：", "；", "？", "（", "）", "–", "•", "→"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paper_reviewer"]
